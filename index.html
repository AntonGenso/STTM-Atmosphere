<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f2540" />
<title>Atmosphere — STTM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/fon_1.webp" type="image/webp">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a1a30;
    font-family: 'Unbounded', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .app {
    position: relative;
    width: 100%;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    /* JPEG fallback для очень старых браузеров */
    background-image: url('assets/fon_1.jpg');
    /* WebP для всех современных (Chrome, Firefox, Safari 14+, Edge) */
    background-image: -webkit-image-set(
      url('assets/fon_1.webp') 1x,
      url('assets/fon_1.jpg')  1x
    );
    background-image: image-set(
      url('assets/fon_1.webp') type('image/webp'),
      url('assets/fon_1.jpg')  type('image/jpeg')
    );
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #0a1a30;
    overflow: hidden;
  }

  /* === ТОП-БАР: переключатель языков === */
  .topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: max(env(safe-area-inset-top), 16px) 20px 0;
    display: flex;
    justify-content: flex-end;
    z-index: 10;
  }

  .lang-switcher {
    display: flex;
    gap: 4px;
    background: rgba(10, 26, 48, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    padding: 4px;
  }

  .lang-btn {
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.55);
    font-family: inherit;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .lang-btn:hover {
    color: rgba(255, 255, 255, 0.85);
  }

  .lang-btn.active {
    background: #fff;
    color: #0f2540;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  /* === ЗАГОЛОВОК === */
  .title-wrap {
    position: absolute;
    top: 12%;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    padding: 0 24px;
  }

  .title {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 7.2vw, 38px);
    color: #fff;
    letter-spacing: 0.04em;
    line-height: 1;
    text-shadow:
      0 2px 0 rgba(0, 0, 0, 0.15),
      0 0 24px rgba(150, 200, 255, 0.35),
      0 0 60px rgba(150, 200, 255, 0.15);
    animation: title-in 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes title-in {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* === КНОПКА PLAY === */
  .play-wrap {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 0 32px max(env(safe-area-inset-bottom), 32px);
    display: flex;
    justify-content: center;
    z-index: 10;
    animation: play-in 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
  }

  @keyframes play-in {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .play-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-width: 220px;
    padding: 20px 40px;
    background: #FFA91F;
    color: #0f2540;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.18em;
    text-decoration: none;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow:
      0 8px 24px rgba(255, 169, 31, 0.35),
      0 4px 16px rgba(0, 0, 0, 0.25),
      0 2px 0 rgba(255, 255, 255, 0.35) inset,
      0 -2px 0 rgba(120, 60, 0, 0.12) inset;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .play-btn::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 999px;
    background: rgba(255, 169, 31, 0.35);
    z-index: -1;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50%      { transform: scale(1.1); opacity: 0; }
  }

  .play-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 12px 32px rgba(255, 169, 31, 0.45),
      0 6px 20px rgba(0, 0, 0, 0.3),
      0 2px 0 rgba(255, 255, 255, 0.35) inset,
      0 -2px 0 rgba(120, 60, 0, 0.12) inset;
  }

  .play-btn:active {
    transform: translateY(0) scale(0.98);
  }

  .play-btn .arrow {
    display: inline-block;
    transition: transform 0.25s ease;
  }

  .play-btn:hover .arrow {
    transform: translateX(4px);
  }

  /* Мелкий футер-метка миссии */
  .mission-tag {
    position: absolute;
    top: max(env(safe-area-inset-top), 16px);
    left: 20px;
    z-index: 10;
    font-family: 'Unbounded', sans-serif;
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.24em;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
    padding: 10px 0;
  }

  /* === АДАПТИВ === */
  @media (max-height: 700px) {
    .title-wrap { top: 8%; }
    .title { font-size: clamp(24px, 6.5vw, 32px); }
  }

  @media (min-width: 481px) {
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #122544 0%, #050d1c 100%);
    }
    .app {
      height: min(100dvh, 900px);
      border-radius: 24px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
    }
  }
</style>
</head>
<body>

<div class="app">

  <!-- Верхний бар -->
  <div class="mission-tag" data-i18n="tag">STTM · Mission 4</div>

  <div class="topbar">
    <div class="lang-switcher" role="group" aria-label="Language">
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn active" data-lang="en">EN</button>
    </div>
  </div>

  <!-- Заголовок -->
  <div class="title-wrap">
    <h1 class="title" data-i18n="title">ATMOSPHERE</h1>
  </div>

  <!-- PLAY -->
  <div class="play-wrap">
    <a href="game.html" class="play-btn" id="playBtn">
      <span data-i18n="play">PLAY</span>
      <span class="arrow">›</span>
    </a>
  </div>

</div>

<script>
  // === Переводы ===
  const I18N = {
    uz: {
      tag:   "STTM · Missiya 4",
      title: "ATMOSFERA",
      play:  "O'YNASH"
    },
    ru: {
      tag:   "STTM · Миссия 4",
      title: "АТМОСФЕРА",
      play:  "ИГРАТЬ"
    },
    en: {
      tag:   "STTM · Mission 4",
      title: "ATMOSPHERE",
      play:  "PLAY"
    }
  };

  // === Передача nickname в game.html ===
  // STTM-платформа передаёт ник через URL ?nickname=...
  // Прокидываем его дальше в игру
  const urlParams = new URLSearchParams(window.location.search);
  const nickname = urlParams.get('nickname');
  if (nickname) {
    document.getElementById('playBtn').href =
      'game.html?nickname=' + encodeURIComponent(nickname);
  }

  // === Переключатель языков ===
  const buttons = document.querySelectorAll('.lang-btn');
  const applyLang = (lang) => {
    document.documentElement.lang = lang;
    const dict = I18N[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[key]) el.textContent = dict[key];
    });
    buttons.forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    try { localStorage.setItem('sttm_lang', lang); } catch (e) {}
  };

  buttons.forEach(btn => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang));
  });

  // Восстановим язык, если уже выбирали
  try {
    const saved = localStorage.getItem('sttm_lang');
    if (saved && I18N[saved]) applyLang(saved);
  } catch (e) {}
</script>

</body>
</html>
